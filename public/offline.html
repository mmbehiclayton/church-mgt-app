<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Mwiki Altar</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%); color: #e2e8f0; }
      .card { background: rgba(30, 41, 59, 0.7); border-color: rgba(255,255,255,0.08); }
      .muted { color: #94a3b8; }
    }
    .card {
      max-width: 26rem;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
    p { margin: 0 0 1.25rem; line-height: 1.5; }
    .muted { color: #64748b; font-size: 0.9rem; }
    button {
      cursor: pointer;
      background: #4f46e5;
      color: white;
      border: 0;
      padding: 0.65rem 1.25rem;
      border-radius: 0.625rem;
      font-weight: 600;
      font-size: 0.95rem;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⛪</div>
    <h1>You're offline</h1>
    <p class="muted">We can't reach Mwiki Main Altar CMS right now. Check your connection and try again — recently visited pages may still work.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
